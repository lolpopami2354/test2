<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Selection</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #1f1c2c, #928dab);
      color: #fff;
    }

    header {
      text-align: center;
      padding: 2rem;
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
      padding: 2rem;
      max-width: 1200px;
      margin: auto;
    }

    .game-card {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .game-card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }

    .game-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .game-card h3 {
      margin: 1rem;
      font-size: 1.2rem;
    }

    .game-card p {
      margin: 0 1rem 1rem;
      font-size: 0.9rem;
      color: #ccc;
    }
  </style>
</head>
<body>
  <header>🎮 Choose Your Game</header>
  <div class="game-card" onclick="window.location.href='games/adventure-quest.html'">
    <img src="https://via.placeholder.com/300x180?text=Game+1" alt="Game 1" />
    <h3>Adventure Quest</h3>
    <p>Explore mysterious lands and conquer epic quests.</p>
  </div>
    <div class="game-card">
      <img src="https://via.placeholder.com/300x180?text=Game+2" alt="Game 2" />
      <h3>Racing Thunder</h3>
      <p>Burn rubber in high-speed racing challenges.</p>
    </div>
    <div class="game-card">
      <img src="https://via.placeholder.com/300x180?text=Game+3" alt="Game 3" />
      <h3>Galaxy Wars</h3>
      <p>Command your fleet and battle across the stars.</p>
    </div>
  </div>
</body>
</html>
